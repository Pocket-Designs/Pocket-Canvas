name: Build

# What runs when:
#   push to main / pull request  -> tests, and a build check on Windows and Linux.
#                                   Nothing is stored, so no Actions storage is used.
#   tag v1.2.3 (git tag v0.1.0 && git push --tags)
#                                -> installers are attached to a GitHub Release. Release
#                                   files do NOT count towards the Actions storage quota.
#                                   (The server image is built on your own server by
#                                   docker compose, so it is not published here.)
#   "Run workflow" button (Actions tab)
#                                -> installers are put on a "Test build" pre-release
#                                   (replaced each time). No artifacts are stored at all,
#                                   so the Actions storage quota is never touched.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Where installers go: the version's release for a tag, otherwise the rolling test build.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'test-build' }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm test
      - name: App tests
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst-dev libpng-dev
          npm ci
          npm test

  # Creates the GitHub Release once, so the Windows and Linux jobs can both add files to it.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create version release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Pocket-Connect $RELEASE_TAG" --generate-notes --verify-tag
      - name: Create test-build pre-release (replaces the previous one)
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Test build (${GITHUB_SHA::7})" \
            --notes "Untested build from $GITHUB_REF_NAME at ${GITHUB_SHA::7}. Replaced every time the workflow is run by hand. For proper versions see the other releases."

  linux:
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.release.result != 'failure' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build AppImage and .deb
        working-directory: app
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst-dev libpng-dev rpm
          npm ci
          npm run dist:linux
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" app/dist/*.AppImage app/dist/*.deb --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.release.result != 'failure' && github.event_name != 'pull_request' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build installer (.exe) and .msi
        working-directory: app
        run: |
          npm ci
          npm run dist:win
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" app/dist/*.exe app/dist/*.msi --clobber --repo "$GITHUB_REPOSITORY"
