# Pocket-Connect server stack for a Proxmox VM (or LXC with Docker).
#   caddy   - HTTPS front door (Let's Encrypt for a public domain, or its own CA for LAN-only)
#   server  - accounts, address book, device presence and signalling
#   turn    - coturn relay for connections that cannot go direct (strict NAT, mobile data)
# Copy .env.example to .env, fill it in, then: docker compose up -d
services:
  server:
    build: ../server
    image: pocket-connect-server:latest
    restart: unless-stopped
    environment:
      PC_PUBLIC_HOST: ${PC_DOMAIN}
      PC_REGISTRATION: ${PC_REGISTRATION:-first-only}
      PC_TRUST_PROXY: "1"
      PC_STUN_URLS: stun:${PC_DOMAIN}:3478
      PC_TURN_URLS: turn:${PC_DOMAIN}:3478?transport=udp,turn:${PC_DOMAIN}:3478?transport=tcp
      PC_TURN_SECRET: ${PC_TURN_SECRET}
    volumes:
      - pc-data:/data
    networks: [pc]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    environment:
      PC_DOMAIN: ${PC_DOMAIN}
      PC_TLS: ${PC_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
    networks: [pc]
    depends_on: [server]

  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # Media through the relay is still end-to-end DTLS encrypted, so plain TURN is fine.
    # Host networking: TURN needs a wide UDP port range, which is slow and fragile through Docker NAT.
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${PC_TURN_SECRET}
      - --realm=${PC_DOMAIN}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      # Stop the relay being used to reach your own private networks.
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --external-ip=${PC_PUBLIC_IP}

volumes:
  pc-data:
  caddy-data:

networks:
  pc:
