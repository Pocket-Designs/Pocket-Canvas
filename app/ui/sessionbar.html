<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Pocket-Connect session</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { background: #14191f; overflow: hidden; }
  body { padding: 8px 10px; -webkit-app-region: drag; border: 1px solid #ff7a45; border-radius: 0; height: 100vh; }
  .row { gap: 10px; }
  .who { font-size: 13px; line-height: 1.25; }
  .who b { color: #e8edf2; }
  .who small { color: #8b97a5; display: block; font-size: 11px; }
  button { -webkit-app-region: no-drag; }
  .line { display: flex; align-items: center; gap: 8px; height: 24px; font-size: 12px; color: #8b97a5; }
  .line b { color: #e8edf2; font-weight: 600; }
  .rec { width: 10px; height: 10px; border-radius: 50%; background: #ff7a45; animation: pulse 1.6s infinite; flex: none; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<div class="row">
  <span class="rec"></span>
  <div class="who grow"><b id="headline">Someone is connected</b><small>Pocket-Connect remote session</small></div>
  <button class="btn small" id="open">Open</button>
  <button class="btn small danger" id="kickAll">End</button>
</div>
<div id="list"></div>
<script src="lib/icons.js"></script>
<script src="lib/ui.js"></script>
<script src="sessionbar.js"></script>
</body>
</html>
