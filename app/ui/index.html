<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'">
<title>Pocket-Connect</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <img class="brand-logo" src="img/logo.png" alt="" aria-hidden="true">
      <span>Pocket<b>-Connect</b></span>
    </div>

    <section class="me card">
      <div class="me-head">
        <span class="dot" id="srvDot"></span>
        <span id="srvText" class="muted">Starting…</span>
      </div>
      <label class="me-label">Your ID</label>
      <div class="me-id row">
        <span id="myId" class="mono">—</span>
        <button class="btn ghost small icon" id="copyId" title="Copy ID"></button>
      </div>
      <div class="me-sub muted" id="myLan"></div>
      <label class="me-label">One-time password</label>
      <div class="me-pw row">
        <span id="oneTime" class="mono">••••••••</span>
        <button class="btn ghost small icon" id="showOt" title="Show"></button>
        <button class="btn ghost small icon" id="copyOt" title="Copy"></button>
        <button class="btn ghost small icon" id="newOt" title="New password"></button>
      </div>
      <button class="perm row" id="permBtn">
        <span class="perm-ico"></span>
        <span class="grow"><b id="permTitle">Permanent password</b><small id="permSub">Not set</small></span>
      </button>
    </section>

    <nav class="nav" id="nav">
      <button data-view="devices" class="on"><i data-ico="grid"></i>Devices</button>
      <button data-view="nearby"><i data-ico="radar"></i>Nearby</button>
      <button data-view="android"><i data-ico="phone"></i>Android</button>
      <button data-view="account"><i data-ico="user"></i>Account</button>
      <button data-view="settings"><i data-ico="settings"></i>Settings</button>
      <button data-view="activity"><i data-ico="activity"></i>Activity</button>
    </nav>

    <section class="live hidden" id="live">
      <div class="live-title"><span class="dot ok"></span>Connected to this computer</div>
      <div id="liveList"></div>
    </section>
  </aside>

  <main class="main">
    <header class="quick">
      <div class="quick-box">
        <i data-ico="link"></i>
        <input id="quickTarget" class="grow" placeholder="Partner ID, IP address or adb:serial" spellcheck="false" autocomplete="off">
        <div class="seg" id="quickMode">
          <button data-mode="desktop" class="on" title="Remote desktop"><i data-ico="desktop"></i>Desktop</button>
          <button data-mode="terminal" title="Console / command line"><i data-ico="terminal"></i>Console</button>
          <button data-mode="both" title="Desktop and console"><i data-ico="both"></i>Both</button>
        </div>
        <button class="btn primary" id="quickGo">Connect</button>
      </div>
    </header>

    <div class="views">
      <section class="view" id="view-devices"></section>
      <section class="view hidden" id="view-nearby"></section>
      <section class="view hidden" id="view-android"></section>
      <section class="view hidden" id="view-account"></section>
      <section class="view hidden" id="view-settings"></section>
      <section class="view hidden" id="view-activity"></section>
    </div>
  </main>
</div>
<div class="toast-wrap" id="toasts"></div>
<script src="vendor/qrcode.js"></script>
<script src="lib/icons.js"></script>
<script src="lib/ui.js"></script>
<script src="app.js"></script>
</body>
</html>
