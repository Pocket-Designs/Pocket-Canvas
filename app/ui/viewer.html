<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self'">
<title>Pocket-Connect</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header class="bar" id="bar">
  <div class="who">
    <span class="os-badge" id="osBadge"></span>
    <div>
      <b id="title">Connecting…</b>
      <div class="sub"><span class="dot" id="stDot"></span><span id="stText">Starting</span></div>
    </div>
  </div>
  <div class="seg tabs hidden" id="tabs"></div>
  <div class="spacer"></div>
  <div class="tools" id="tools"></div>
  <button class="btn small danger" id="hangup"><i data-ico="power"></i>Disconnect</button>
</header>

<main class="stage" id="stage">
  <section class="pane" id="pane-desktop">
    <video id="video" autoplay playsinline muted tabindex="0"></video>
  </section>
  <section class="pane hidden" id="pane-terminal">
    <div id="term"></div>
  </section>
  <section class="pane hidden" id="pane-android">
    <div class="android-wrap">
      <div class="phone" id="phone">
        <canvas id="androidCanvas" tabindex="0"></canvas>
      </div>
      <div class="phone-keys" id="phoneKeys"></div>
    </div>
  </section>
  <section class="pane hidden" id="pane-aterm">
    <div id="aterm"></div>
  </section>

  <div class="overlay" id="overlay">
    <div class="ov-card" id="ovCard"></div>
  </div>
</main>
<div class="toast-wrap" id="toasts"></div>
<script src="vendor/scrypt.js"></script>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="lib/icons.js"></script>
<script src="lib/ui.js"></script>
<script src="lib/proto.js"></script>
<script src="viewer.js"></script>
</body>
</html>
